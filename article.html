<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel - Yoojun Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Yoojun</a>
        <div class="nav-links">
            <a href="index.html">Blog</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <div class="article-detail">
        <h1 id="articleTitle"></h1>
        <div class="meta" id="articleMeta"></div>
        <div class="tags" id="articleTags"></div>
        <div class="content" id="articleContent" style="margin-top:1.5rem;"></div>
    </div>

    <div class="comments">
        <h3>Komentar</h3>
        <form class="comment-form" id="commentForm">
            <input type="text" id="commentName" placeholder="Nama" required>
            <textarea id="commentText" placeholder="Tulis komentar..." rows="3" required></textarea>
            <button type="submit">Kirim Komentar</button>
        </form>
        <div id="commentList"></div>
    </div>

    <footer>&copy; 2026 Yoojun Blog. Dibuat dengan HTML, CSS, JS.</footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>initArticle();</script>
</body>
</html>
